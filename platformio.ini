[env]
platform = atmelavr
framework = arduino
monitor_speed = 9600
lib_deps = arduino-libraries/Servo
; upload_port = COM3        ; uncomment and set if auto-detect picks the wrong port

[env:nanoatmega328]
board = nanoatmega328       ; Nano with old bootloader (most clones)

[env:nanoatmega328new]
board = nanoatmega328new    ; Nano with new bootloader (genuine / newer boards)
